{% load static %}

<header class="admin-header">
  <div class="header-left">
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>
    
    <!-- Search Bar -->
    <div class="header-search">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M8 4C5.79086 4 4 5.79086 4 8C4 10.2091 5.79086 12 8 12C10.2091 12 12 10.2091 12 8C12 5.79086 10.2091 4 8 4ZM2 8C2 4.68629 4.68629 2 8 2C11.3137 2 14 4.68629 14 8C14 9.29583 13.5892 10.4957 12.8907 11.4765L17.7071 16.2929C18.0976 16.6834 18.0976 17.3166 17.7071 17.7071C17.3166 18.0976 16.6834 18.0976 16.2929 17.7071L11.4765 12.8907C10.4957 13.5892 9.29583 14 8 14C4.68629 14 2 11.3137 2 8Z" fill="currentColor"/>
      </svg>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Search users, courses, sessions..."
        aria-label="Search"
      >
    </div>
  </div>
  
  <div class="header-right">
    <!-- Notifications -->
    <button class="header-action" aria-label="Notifications" title="Notifications">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2C7.23858 2 5 4.23858 5 7V10.5858L3.70711 11.8787C3.07714 12.5087 3.52331 13.6 4.41421 13.6H15.5858C16.4767 13.6 16.9229 12.5087 16.2929 11.8787L15 10.5858V7C15 4.23858 12.7614 2 10 2Z" fill="currentColor"/>
        <path d="M8.5 15.6C8.5 14.7716 9.17157 14.1 10 14.1C10.8284 14.1 11.5 14.7716 11.5 15.6C11.5 16.4284 10.8284 17.1 10 17.1C9.17157 17.1 8.5 16.4284 8.5 15.6Z" fill="currentColor"/>
      </svg>
      <span class="badge">3</span>
    </button>
    
    <!-- User Menu -->
    <div class="user-menu" id="userMenu">
      <button class="user-menu__trigger" aria-label="User menu" aria-expanded="false">
        {% if user.is_authenticated %}
          {% if user.profile_picture %}
            <img src="{{ user.profile_picture.url }}" alt="{{ user.full_name }}" class="user-avatar">
          {% else %}
            <div class="user-avatar" style="background: linear-gradient(135deg, var(--primary-500), var(--secondary-500)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px;">
              {{ user.full_name|first|upper|default:user.email|first|upper }}
            </div>
          {% endif %}
          <span class="user-name">{{ user.full_name|default:user.email }}</span>
        {% else %}
          <div class="user-avatar" style="background: var(--gray-300); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px;">?</div>
          <span class="user-name">Guest</span>
        {% endif %}
        <svg class="chevron-icon" width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M5.29289 7.29289C5.68342 6.90237 6.31658 6.90237 6.70711 7.29289L10 10.5858L13.2929 7.29289C13.6834 6.90237 14.3166 6.90237 14.7071 7.29289C15.0976 7.68342 15.0976 8.31658 14.7071 8.70711L10.7071 12.7071C10.3166 13.0976 9.68342 13.0976 9.29289 12.7071L5.29289 8.70711C4.90237 8.31658 4.90237 7.68342 5.29289 7.29289Z" fill="currentColor"/>
        </svg>
      </button>
      
      <div class="user-menu__dropdown">
        {% if user.is_authenticated %}
          <a href="{% url 'admin:accounts_user_change' user.id %}" class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M10 9C11.6569 9 13 7.65685 13 6C13 4.34315 11.6569 3 10 3C8.34315 3 7 4.34315 7 6C7 7.65685 8.34315 9 10 9ZM3 18C3 14.134 6.13401 11 10 11C13.866 11 17 14.134 17 18H3Z" fill="currentColor"/>
            </svg>
            My Profile
          </a>
          
          <a href="{% url 'admin:index' %}#settings" class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M11.49 3.17C11.11 1.61 8.89 1.61 8.51 3.17C8.37 3.73 7.79 4.08 7.23 3.95C5.68 3.57 4.42 4.83 4.8 6.38C4.93 6.94 4.58 7.52 4.02 7.66C2.46 8.04 2.46 10.26 4.02 10.64C4.58 10.78 4.93 11.36 4.8 11.92C4.42 13.47 5.68 14.73 7.23 14.35C7.79 14.22 8.37 14.57 8.51 15.13C8.89 16.69 11.11 16.69 11.49 15.13C11.63 14.57 12.21 14.22 12.77 14.35C14.32 14.73 15.58 13.47 15.2 11.92C15.07 11.36 15.42 10.78 15.98 10.64C17.54 10.26 17.54 8.04 15.98 7.66C15.42 7.52 15.07 6.94 15.2 6.38C15.58 4.83 14.32 3.57 12.77 3.95C12.21 4.08 11.63 3.73 11.49 3.17ZM10 13C11.6569 13 13 11.6569 13 10C13 8.34315 11.6569 7 10 7C8.34315 7 7 8.34315 7 10C7 11.6569 8.34315 13 10 13Z" fill="currentColor"/>
            </svg>
            Settings
          </a>
          
          <hr class="dropdown-divider">
          
          <a href="{% url 'admin:logout' %}" class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M3 3C2.44772 3 2 3.44772 2 4V16C2 16.5523 2.44772 17 3 17H10C10.5523 17 11 16.5523 11 16V14C11 13.4477 10.5523 13 10 13C9.44772 13 9 13.4477 9 14V15H4V5H9V6C9 6.55228 9.44772 7 10 7C10.5523 7 11 6.55228 11 6V4C11 3.44772 10.5523 3 10 3H3ZM14.2929 7.29289C14.6834 6.90237 15.3166 6.90237 15.7071 7.29289L18.7071 10.2929C19.0976 10.6834 19.0976 11.3166 18.7071 11.7071L15.7071 14.7071C15.3166 15.0976 14.6834 15.0976 14.2929 14.7071C13.9024 14.3166 13.9024 13.6834 14.2929 13.2929L15.5858 12H10C9.44772 12 9 11.5523 9 11C9 10.4477 9.44772 10 10 10H15.5858L14.2929 8.70711C13.9024 8.31658 13.9024 7.68342 14.2929 7.29289Z" fill="currentColor"/>
            </svg>
            Logout
          </a>
        {% else %}
          <a href="{% url 'admin:login' %}" class="dropdown-item">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M3 3C2.44772 3 2 3.44772 2 4V16C2 16.5523 2.44772 17 3 17H10C10.5523 17 11 16.5523 11 16V14C11 13.4477 10.5523 13 10 13C9.44772 13 9 13.4477 9 14V15H4V5H9V6C9 6.55228 9.44772 7 10 7C10.5523 7 11 6.55228 11 6V4C11 3.44772 10.5523 3 10 3H3ZM14.2929 7.29289C14.6834 6.90237 15.3166 6.90237 15.7071 7.29289L18.7071 10.2929C19.0976 10.6834 19.0976 11.3166 18.7071 11.7071L15.7071 14.7071C15.3166 15.0976 14.6834 15.0976 14.2929 14.7071C13.9024 14.3166 13.9024 13.6834 14.2929 13.2929L15.5858 12H10C9.44772 12 9 11.5523 9 11C9 10.4477 9.44772 10 10 10H15.5858L14.2929 8.70711C13.9024 8.31658 13.9024 7.68342 14.2929 7.29289Z" fill="currentColor"/>
            </svg>
            Login
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</header>

<!-- Mobile Backdrop -->
<div class="mobile-backdrop" id="mobileBackdrop"></div>
